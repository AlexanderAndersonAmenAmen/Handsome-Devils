[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# The vanilla title renderer always uses a fixed logical width of 13 units.
# Since this mod deliberately widens the balatro atlas frame from 333px to
# 499px, widen the rendered Sprite by the same ratio so pixels are not squeezed.
# Height remains at the original pixel scale automatically.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
G.SPLASH_LOGO = Sprite(0, 0,
        13*SC_scale,
        13*SC_scale*(G.ASSET_ATLAS["balatro"].py/G.ASSET_ATLAS["balatro"].px),
        G.ASSET_ATLAS["balatro"], {x=0,y=0})
'''
position = "at"
payload = '''
G.SPLASH_LOGO = Sprite(0, 0,
        13*SC_scale*(G.ASSET_ATLAS["balatro"].px/333),
        13*SC_scale*(G.ASSET_ATLAS["balatro"].py/333),
        G.ASSET_ATLAS["balatro"], {x=0,y=0})
'''
match_indent = true
times = 2

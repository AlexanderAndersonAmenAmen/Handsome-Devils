[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "if G.GAME.used_vouchers[v.key] then"
position = "at"
payload = '''
local hnds_visible_vouchers = (G.GAME.hnds_wasted_wish_active and G.GAME.hnds_wasted_wish_used_vouchers) or G.GAME.used_vouchers
if hnds_visible_vouchers[v.key] then
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "card.ability.order = vv.order"
position = "after"
payload = '''
if G.GAME.hnds_wasted_wish_active then
    card.debuff = true
    card.debuffed_by_blind = true
end
'''
match_indent = true
times = 1

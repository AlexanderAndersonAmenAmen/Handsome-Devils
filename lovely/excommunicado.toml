[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling"
position = "after"
match_indent = true
payload = '''
if HNDS and HNDS.excommunicado_blind_score then
    self.chips = HNDS.excommunicado_blind_score(G.GAME.blind_on_deck, self.config.blind.key, self.chips)
end
'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = "after"
match_indent = true
payload = '''
if HNDS and HNDS.excommunicado_blind_score then
    blind_amt = HNDS.excommunicado_blind_score(type, blind_choice.config.key, blind_amt)
end
'''

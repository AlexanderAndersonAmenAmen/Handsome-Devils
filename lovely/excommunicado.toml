[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.round_resets.blind_choices.Boss = get_new_boss()"
position = "at"
match_indent = true
payload = '''
if (HNDS and HNDS.excommunicado_effect_active and HNDS.excommunicado_effect_active()) then
    self.GAME.round_resets.blind_choices.Small = HNDS.get_excommunicado_boss('excom_small')
    self.GAME.round_resets.blind_choices.Big = HNDS.get_excommunicado_boss('excom_big')
    self.GAME.round_resets.blind_choices.Boss = get_new_boss()
else
    self.GAME.round_resets.blind_choices.Boss = get_new_boss()
end
'''


[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "G.GAME.round_resets.blind_choices.Boss = get_new_boss()"
position = "at"
match_indent = true
payload = '''
if (HNDS and HNDS.excommunicado_effect_active and HNDS.excommunicado_effect_active()) then
    G.GAME.round_resets.blind_choices.Small = HNDS.get_excommunicado_boss('excom_small')
    G.GAME.round_resets.blind_choices.Big = HNDS.get_excommunicado_boss('excom_big')
    G.GAME.round_resets.blind_choices.Boss = get_new_boss()
else
    G.GAME.round_resets.blind_choices.Boss = get_new_boss()
end
'''


[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling"
position = "at"
match_indent = true
payload = '''
if (HNDS and HNDS.excommunicado_effect_active and HNDS.excommunicado_effect_active()) then
    local base_score = get_blind_amount(G.GAME.round_resets.ante) * self.mult * G.GAME.starting_params.ante_scaling
    if G.GAME.blind_on_deck == 'Small' then
        self.chips = (function(v) return _G.type(v) == 'number' and math.floor(v) or v end)(base_score * 0.5)
    elseif G.GAME.blind_on_deck == 'Big' then
        self.chips = (function(v) return _G.type(v) == 'number' and math.floor(v) or v end)(base_score * 0.75)
    else
        self.chips = base_score
    end
else
    self.chips = get_blind_amount(G.GAME.round_resets.ante) * self.mult * G.GAME.starting_params.ante_scaling
end
'''


[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = "after"
match_indent = true
payload = '''
if (HNDS and HNDS.excommunicado_effect_active and HNDS.excommunicado_effect_active()) then
    if type == 'Small' then
        blind_amt = (function(v) return _G.type(v) == 'number' and math.floor(v) or v end)(blind_amt * 0.5)
    elseif type == 'Big' then
        blind_amt = (function(v) return _G.type(v) == 'number' and math.floor(v) or v end)(blind_amt * 0.75)
    end
end
'''

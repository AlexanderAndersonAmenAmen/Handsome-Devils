[manifest]
version = "1.0.0"
dump_lua = true
priority = 40

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if from then card = from:remove_card(card) end"
position = "before"
payload = '''
if from then
    local hnds_in_source = false
    for _, hnds_source_card in ipairs(from.cards or {}) do
        if hnds_source_card == card then
            hnds_in_source = true
            break
        end
    end
    if not hnds_in_source then return true end
end
'''
match_indent = true
times = 1

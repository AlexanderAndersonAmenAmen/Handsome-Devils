[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = '''
if self.draw_hand == true then G.FUNCS.draw_from_deck_to_hand() end
'''
position = "after"
match_indent = true
payload = '''
if self.draw_hand ~= true and self.kind == "Standard" then
    for _, c in ipairs(G.pack_cards.cards) do
        if c.config and c.config.center_key == "c_hnds_spectrum" then
            G.FUNCS.draw_from_deck_to_hand()
            break
        end
    end
end
'''


[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
if _type == 'Base' then
    forced_key = 'c_base'
end
'''
position = 'at'
match_indent = true
payload = '''
if _type == 'Base' and not forced_key then
    forced_key = 'c_base'
end
'''

[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# -----------------------------
# DNA Tag
# -----------------------------

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = 'for _, v in ipairs(info_queue) do'
position = "before"
payload = '''
    if card and card.ability and card.ability.hnds_copies_to_create then
        local copies = card.ability.hnds_copies_to_create
        info_queue[#info_queue+1] = { set = "Other", key = "dna_tag_tooltip_"..(copies ~= 1 and "plural" or "singular"), vars = {copies}}
    end
'''
match_indent = true

# -----------------------------
# The Devil rolled-effect tooltip
# -----------------------------
# Attach hover behaviour to the blind badge without modifying the surrounding
# blind-choice UI tree. `times = 1` selects create_UIBox_blind_choice rather
# than the later run-summary badge that uses the same draw-step snippet.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
  blind_choice.animation:define_draw_steps({
    {shader = 'dissolve', shadow_height = 0.05},
    {shader = 'dissolve'}
  })
'''
position = "after"
payload = '''
  if HNDS and HNDS.attach_devil_blind_tooltip then
    HNDS.attach_devil_blind_tooltip(blind_choice.animation, blind_choice.config)
  end
'''
match_indent = true
times = 1

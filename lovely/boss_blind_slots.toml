[manifest]
version = "1.0.0"
dump_lua = true
priority = 0


[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''if G.GAME.blind:get_type() == 'Boss' then
                    local _handname, _played, _order = 'High Card', -1, 100'''
position = "at"
match_indent = false
times = 1
payload = '''if G.GAME.blind_on_deck == 'Boss' then
                    local _handname, _played, _order = 'High Card', -1, 100'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.blind:get_type() == 'Boss' and not G.GAME.seeded and not G.GAME.challenge  then"
position = "at"
match_indent = true
times = 1
payload = "if G.GAME.blind_on_deck == 'Boss' and not G.GAME.seeded and not G.GAME.challenge  then"

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''if G.GAME.blind:get_type() == 'Boss' then
                    G.GAME.voucher_restock = nil'''
position = "at"
match_indent = false
times = 1
payload = '''if G.GAME.blind_on_deck == 'Boss' then
                    G.GAME.voucher_restock = nil'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.round_resets.ante == G.GAME.win_ante and G.GAME.blind:get_type() == 'Boss' then"
position = "at"
match_indent = true
times = 1
payload = "if G.GAME.round_resets.ante >= G.GAME.win_ante and G.GAME.blind_on_deck == 'Boss' then"

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
if G.GAME.round_resets.blind == G.P_BLINDS.bl_small then
                            G.GAME.round_resets.blind_states.Small = 'Defeated'
'''
position = "at"
match_indent = false
times = 1
payload = '''
if G.GAME.blind_on_deck == 'Small' then
                            G.GAME.round_resets.blind_states.Small = 'Defeated'
'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
elseif G.GAME.round_resets.blind == G.P_BLINDS.bl_big then
                            G.GAME.round_resets.blind_states.Big = 'Defeated'
'''
position = "at"
match_indent = false
times = 1
payload = '''
elseif G.GAME.blind_on_deck == 'Big' then
                            G.GAME.round_resets.blind_states.Big = 'Defeated'
'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
if G.GAME.round_resets.blind == G.P_BLINDS.bl_small then
                G.GAME.round_resets.blind_states.Small = 'Current'
'''
position = "at"
match_indent = false
times = 1
payload = '''
if G.GAME.blind_on_deck == 'Small' then
                G.GAME.round_resets.blind_states.Small = 'Current'
'''

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
elseif G.GAME.round_resets.blind == G.P_BLINDS.bl_big then
                G.GAME.round_resets.blind_states.Big = 'Current'
'''
position = "at"
match_indent = false
times = 1
payload = '''
elseif G.GAME.blind_on_deck == 'Big' then
                G.GAME.round_resets.blind_states.Big = 'Current'
'''


[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
    if _top_button then
        _top_button.config.colour = G.C.UI.BACKGROUND_INACTIVE
        _top_button.config.button = nil
        _top_button.config.hover = false
        _top_button.children[1].config.colour = G.C.UI.TEXT_INACTIVE
    end
end
'''
position = "after"
payload = '''
if HNDS and HNDS.sync_platinum_blind_tag_ui then
    HNDS.sync_platinum_blind_tag_ui(e)
end
'''
match_indent = true


[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.GAME.round_resets.blind_states[e.config.id] == 'Defeated' then"
position = "before"
payload = "(hnds_config and hnds_config.enableBlindUpgradeButton and (G.GAME.hnds_upgraded_blinds or {})[tostring(G.GAME.round_resets.ante)..':'..e.config.id]) or"
match_indent = true


[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.FUNCS.skip_blind = function(e)"
position = "after"
payload = '''
if HNDS and HNDS.platinum_skip_is_locked and HNDS.platinum_skip_is_locked(G.GAME.blind_on_deck) then
    return
end
'''
match_indent = true
